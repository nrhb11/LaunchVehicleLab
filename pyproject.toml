[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "launchvehiclelab"
version = "0.1.0"
description = "Open-source launch-vehicle preliminary design and simulation platform"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "LaunchVehicleLab contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pyside6>=6.7.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[project.scripts]
lvlab = "launchvehiclelab.cli:main"
lvlab-gui = "launchvehiclelab.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
